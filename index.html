<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>午休健身计划</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-title">午休健身计划</div>
      
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="today" type="button">今天</button>
      <button class="tab" data-tab="history" type="button">历史</button>
    </nav>
  </header>

  <main>
    <section id="panel-today" class="panel active" role="tabpanel">
      <p class="goal" id="goal">加载中…</p>
      <h1 class="date-line" id="date-line">今天</h1>
      <div class="session-row">
        <div class="session-title" id="session-title"></div>
        <span class="badge" id="badge" hidden></span>
      </div>
      <p class="tip" id="tip"></p>
      <div class="section-label">训练清单</div>
      <div class="checklist" id="checklist"></div>
      <div class="footer-tip" id="footer-tip"></div>
      <p class="disclaimer">仅作个人训练安排参考，不构成医疗建议。</p>
    </section>

    <section id="panel-history" class="panel" role="tabpanel">
      <h1 class="date-line" style="font-size:24px;margin-bottom:14px">训练历史</h1>
      <div id="history-list" class="history-list"></div>
      <p class="disclaimer">记录来自交接文档与对话；更新请改 data/plan.json。</p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
